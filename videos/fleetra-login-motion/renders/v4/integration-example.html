<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleetra Analytics — schéma animé (v4)</title>
<style>
  /* Le fond (profondeur) vit dans le CSS : il reproduit celui de l'aperçu MP4
     et peut être changé sans re-rendre la vidéo transparente posée par-dessus. */
  .fleetra-visual {
    position: relative;
    aspect-ratio: 960 / 540;
    width: 100%;
    overflow: hidden;
    background:
      radial-gradient(75% 75% at 50% 50%, transparent 55%, rgba(0, 0, 0, .45) 100%),            /* bords assombris */
      radial-gradient(circle at 50% 50.4%, rgba(255, 90, 30, .07) 0, rgba(255, 90, 30, 0) 40%), /* lueur derrière le hub */
      radial-gradient(circle, rgba(255, 255, 255, .04) 1px, transparent 1.2px) 0 0 / 2.5% 4.444%, /* grille de points 24 px */
      #081318;
  }
  .fleetra-visual video, .fleetra-visual img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none;
  }
  .fleetra-visual img { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .fleetra-visual video { display: none; }
    .fleetra-visual img { display: block; }     /* version fixe, sans particules */
  }
</style>
</head>
<body style="margin:0">
  <div class="fleetra-visual">
    <video autoplay muted loop playsinline aria-hidden="true">
      <source src="fleetra-motion-pro-alpha.webm" type='video/webm; codecs="vp9"' media="(min-resolution: 1.5dppx)">
      <source src="fleetra-motion-pro-alpha-1x.webm" type='video/webm; codecs="vp9"'>
    </video>
    <img src="fleetra-motion-pro-alpha-frame.png" alt="Recouvrement et Tracking alimentent Fleetra Analytics, qui centralise, croise et transforme les données en Finance, Performance, Opérations et Décision.">
  </div>
</body>
</html>
