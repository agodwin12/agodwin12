<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleetra Analytics — intégration du motion transparent</title>
<style>
  /* Le background vit dans le CSS : il peut être remplacé (image, gradient, texture, animation) sans re-rendre la vidéo. */
  .fleetra-visual {
    position: relative;
    aspect-ratio: 1182 / 874;               /* format de la vidéo */
    width: 100%;
    background: #060b0d;                    /* ← à remplacer librement */
    overflow: hidden;
  }
  .fleetra-visual video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;                    /* jamais rognée, reste nette en 2x */
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .fleetra-visual video { display: none; }
    .fleetra-visual { background-image: url("fleetra-motion-alpha-frame.png"); background-size: contain; background-repeat: no-repeat; }
  }
</style>
</head>
<body style="margin:0">
  <div class="fleetra-visual">
    <video autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <!-- 2x pour les écrans haute densité, 1x en repli léger -->
      <source src="fleetra-motion-alpha.webm" type='video/webm; codecs="vp9"' media="(min-resolution: 1.5dppx)">
      <source src="fleetra-motion-alpha-1x.webm" type='video/webm; codecs="vp9"'>
    </video>
  </div>
</body>
</html>
